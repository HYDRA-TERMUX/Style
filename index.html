<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50KB Image Compressor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3a0ca3;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: white;
            min-height: 100vh;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: fadeInDown 1s;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            margin-bottom: 30px;
            animation: fadeIn 1.5s;
        }
        
        #fileInput {
            display: none;
        }
        
        .upload-btn {
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            display: block;
            margin: 0 auto 20px;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.4);
        }
        
        .upload-btn:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.6);
        }
        
        .slider-container {
            margin: 25px 0;
        }
        
        #quality {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: rgba(255,255,255,0.2);
            outline: none;
            -webkit-appearance: none;
        }
        
        #quality::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }
        
        #compressBtn {
            background: linear-gradient(45deg, #4cc9f0, #4895ef);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            display: block;
            margin: 25px auto 0;
            box-shadow: 0 4px 15px rgba(76, 201, 240, 0.4);
        }
        
        #compressBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 201, 240, 0.6);
        }
        
        #compressBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        #downloadBtn {
            background: linear-gradient(45deg, #f72585, #b5179e);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            text-decoration: none;
            display: none;
            margin: 20px auto 0;
            box-shadow: 0 4px 15px rgba(247, 37, 133, 0.4);
            text-align: center;
        }
        
        #downloadBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(247, 37, 133, 0.6);
        }
        
        .comparison-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 30px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .image-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 75%; /* Aspect ratio */
        }
        
        .image-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        #originalImg, #compressedImg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #f5f5f5;
        }
        
        #compressedImg {
            width: 50%;
        }
        
        .divider {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 4px;
            background: white;
            transform: translateX(-50%);
            cursor: ew-resize;
            z-index: 10;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        .divider::before {
            content: "⯈";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        
        .file-info {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 14px;
            color: rgba(255,255,255,0.9);
        }
        
        .animate__animated.animate__delay-1s {
            animation-delay: 1s;
        }
        
        .animate__animated.animate__delay-2s {
            animation-delay: 2s;
        }
    </style>
</head>
<body>
    <h1 class="animate__animated animate__fadeInDown">Image Compressor For Website</h1>
    
    <div class="container animate__animated animate__fadeIn animate__delay-1s">
        <label for="fileInput" class="upload-btn animate__animated animate__pulse animate__infinite">Choose Image</label>
        <input type="file" id="fileInput" accept="image/*">
        
        <div class="slider-container">
            <label for="quality">Quality: <span id="qualityValue">80</span>%</label>
            <input type="range" id="quality" min="1" max="100" value="80">
        </div>
        
        <button id="compressBtn" disabled>Compress Image</button>
        <a id="downloadBtn" download="compressed.jpg">Download Compressed Image</a>
    </div>
    
    <div id="comparisonSection" style="display: none;">
        <div class="comparison-container animate__animated animate__fadeIn animate__delay-2s">
            <div class="image-container">
                <div class="image-wrapper">
                    <img id="originalImg">
                </div>
                <div class="image-wrapper">
                    <img id="compressedImg">
                </div>
                <div class="divider" id="divider"></div>
            </div>
            <div class="file-info">
                <span id="originalSize">Original: --</span>
                <span id="compressedSize">Compressed: --</span>
            </div>
        </div>
    </div>

    <script src="compressor.js"></script>
</body>
</html>
